# Render Blueprint for the Mitti MCP server.
# Deploy: push this repo to GitHub, then on render.com choose
# "New +" -> "Blueprint" and point it at this repo. Render reads this file
# automatically.
#
# This runs the server over streamable-HTTP (mcp.http_app in server.py),
# not stdio — stdio is only for local clients like Claude Desktop.
#
# IMPORTANT: the MCP endpoint is served at /mcp (FastMCP's default
# streamable-http path), not at "/". If Render's health check (which hits "/"
# by default) reports the service unhealthy despite it running fine, set
# healthCheckPath below to "/mcp" or add a trivial health route in server.py —
# this wasn't verified against a live Render deploy.
services:
  - type: web
    name: mitti-mcp
    runtime: python
    plan: starter
    buildCommand: "pip install uv && uv sync --frozen"
    startCommand: "uv run uvicorn mitti_mcp.server:http_app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MITTI_API_TOKEN
        sync: false # set manually in the Render dashboard — never commit real tokens
      - key: MITTI_MCP_RATE_LIMIT_RPS
        value: "10"
