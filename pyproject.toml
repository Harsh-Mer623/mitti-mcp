[project]
name = "mitti-mcp"
version = "0.2.0"
description = "Production-grade MCP server for Mitti (formerly SafetyCulture) using FastMCP"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[apps]>=4.0.3",
    "httpx",
    "pydantic>=2.0",
    "python-dotenv",
    "uvicorn>=0.49.0",
]

[project.scripts]
mitti-mcp = "mitti_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitti_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
]
